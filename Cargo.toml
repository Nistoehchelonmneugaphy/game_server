[profile.dev]
strip = "symbols"
opt-level = 1
debug = false

[workspace]
resolver = "3"
members = ["workspace_crates/*"]

[workspace.dependencies]
shared = { path = "workspace_crates/shared" }
strum = { version = "0.28.0", features = ["derive"] }
config = "0.15.23"
dotenvy = "0.15.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = {version = "1.0.150"}
tokio = { version = "1.52.3", features = ["full"] }
reqwest = { version = "0.13.4", features = ["json", "cookies"] }
anyhow = { version = "1.0.102" }
server = { git = "ssh://git@github.com/Aeroel/server_2_only.git"}
auth_system_structs = { git = "ssh://git@github.com/Aeroel/auth_system.git"}